<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Built to Bloom — אופציה 2: רשת Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/styles.css" />
<style>
  /* ===== אופציה 2 — רשת Bento (mosaic) ===== */
  .clbl{position:fixed;top:0;inset-inline:0;z-index:50;background:var(--ink,#241f2e);color:#fff;text-align:center;font-family:"Rubik";font-weight:600;padding:7px;font-size:.9rem}
  .hero{padding-top:84px;padding-bottom:24px}
  .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
  .bento .tile{border-radius:18px;overflow:hidden;position:relative}
  .bento .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .bento .tile:hover img{transform:scale(1.05)}
  /* headline tile */
  .bento .copy{grid-column:span 2;grid-row:span 2;background:var(--blue,#1f9fd6);color:#fff;padding:30px;display:flex;flex-direction:column;justify-content:center}
  .bento .copy .eyebrow{color:#fff;opacity:.95;margin-bottom:10px}
  .bento .copy h1{font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.05;color:#fff;margin:0}
  .bento .copy h1 .accent{color:#ffe14d}
  .bento .copy .hero__actions{margin:18px 0 0}
  .bento .copy .btn--ghost{border-color:rgba(255,255,255,.7);color:#fff}
  /* photo spans */
  .bento .big{grid-column:span 2;grid-row:span 2}
  .bento .wide{grid-column:span 2}
  /* caption chip */
  .bento .tile .cap{position:absolute;inset-block-end:10px;inset-inline-start:10px;background:rgba(255,255,255,.94);border-radius:10px;padding:5px 11px;font-family:"Rubik";font-weight:700;font-size:.78rem}
  @media(max-width:860px){
    .bento{grid-template-columns:1fr 1fr;grid-auto-rows:130px}
    .bento .copy,.bento .big,.bento .wide{grid-column:span 2}
    .bento .copy{grid-row:auto;padding:24px}
  }
</style>
</head>
<body>
<div class="clbl">אופציה 2 · רשת Bento — כותרת + 5 תמונות במשבצות בגדלים שונים, הכי הרבה תמונות "מעל הקיפול"</div>

<header class="nav" id="top">
  <div class="container nav__inner">
    <a href="#" class="brand"><span class="brand__mark"><svg viewBox="0 0 64 64"><rect x="30" y="34" width="4" height="26" rx="2" fill="#54bf3a"/><circle cx="32" cy="16" r="8" fill="#e8302b"/><circle cx="47" cy="24" r="8" fill="#ff7a18"/><circle cx="44" cy="41" r="8" fill="#1f9fd6"/><circle cx="20" cy="41" r="8" fill="#8a7be0"/><circle cx="17" cy="24" r="8" fill="#f5b800"/><circle cx="32" cy="30" r="7" fill="#fff"/><circle cx="32" cy="30" r="4.5" fill="#54bf3a"/></svg></span><span class="brand__text">Built&nbsp;to&nbsp;Bloom</span></a>
    <nav class="nav__links"><a href="#">איך זה עובד</a><a href="#">לוקים</a><a href="#">גלריה</a><a href="#" class="btn btn--dark nav__cta">בדקו זמינות</a></nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <div class="bento">
      <div class="tile copy">
        <p class="eyebrow">🧱 זרי וקישוטי לגו לחתונות</p>
        <h1>פרחים שנבנו <span class="accent">כדי לפרוח.</span></h1>
        <div class="hero__actions">
          <a href="#" class="btn btn--primary">קבלו הצעת מחיר</a>
          <a href="#" class="btn btn--ghost">לגלריה</a>
        </div>
      </div>
      <div class="tile big"><img src="../assets/landing/crystal-vase-table4.jpg" alt="זר פרחי בר בוואזת קריסטל עם מספר שולחן" /><span class="cap">מרכז שולחן · מספור שולחנות</span></div>
      <div class="tile"><img src="../assets/landing/boaz-346.jpg" alt="ציפורי אהבה מלגו" /></div>
      <div class="tile"><img src="../assets/landing/boaz-406.jpg" alt="זר פרחי בר ועציץ מלגו" /></div>
      <div class="tile wide"><img src="../assets/landing/boaz-383.jpg" alt="זר על הבר עם פסלוני חתן וכלה" /><span class="cap">פסלי חתן וכלה</span></div>
      <div class="tile wide"><img src="../assets/landing/boaz-45.jpg" alt="מרכז שולחן מלגו" /><span class="cap">פרחי בר על השולחן</span></div>
    </div>
  </div>
</section>
</body>
</html>
