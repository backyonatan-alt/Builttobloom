<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Built to Bloom · תמונות להורדה</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#20243a;--muted:#666b80;--red:#e8302b;--blue:#1f9fd6;--line:#e9ebf1;--tint:#f6f8fb}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Assistant",system-ui,sans-serif;background:#fff;color:var(--ink);line-height:1.6}
    .strip{display:flex;height:10px}
    .strip i{flex:1}
    .strip i:nth-child(1){background:#e8302b}.strip i:nth-child(2){background:#ff7a18}
    .strip i:nth-child(3){background:#f5b800}.strip i:nth-child(4){background:#54bf3a}
    .strip i:nth-child(5){background:#1f9fd6}.strip i:nth-child(6){background:#8a7be0}
    header{padding:26px 20px 8px;text-align:center}
    h1{font-family:"Rubik";font-weight:800;font-size:1.6rem}
    .sub{color:var(--muted);max-width:42ch;margin:8px auto 0}
    .tip{background:var(--tint);border:1px solid var(--line);border-radius:14px;max-width:560px;margin:18px auto;padding:14px 18px;font-size:.95rem}
    .tip b{color:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:8px 16px 40px;max-width:1000px;margin:auto}
    figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--tint)}
    figure img{width:100%;height:200px;object-fit:cover;display:block}
    figcaption{font-family:"Rubik";font-size:.78rem;color:var(--muted);text-align:center;padding:6px}
    footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 20px 36px}
    a{color:var(--blue)}
  </style>
</head>
<body>
  <div class="strip"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <header>
    <h1>📸 תמונות להורדה</h1>
    <p class="sub">כל התמונות של Built to Bloom — לשימוש ב-CapCut וברשתות.</p>
    <div class="tip">
      📱 <b>באייפון:</b> לחיצה ארוכה על תמונה → "הוסף לתמונות".<br>
      🤖 <b>באנדרואיד:</b> לחיצה ארוכה → "הורד תמונה".<br>
      ואז פותחים את CapCut → מוסיפים מהגלריה.
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Built to Bloom · <a href="./">חזרה לאתר</a></footer>
  <script>
    const files = [
      // newest real product photos
      "467a3712ace7e6a615309860987652fc.jpg","4660e0e40f0db4f75078699be47fbcbf.jpg",
      "33724edd8841df81e0aba94bb7ae583f.jpg","7c8eebdb64e320752d3e696cd378cd20.jpg",
      "52a3b33afc88a8ee9cc6be08afb7c89b.webp","392152d60824e96096d7ba1c9a75a73d.jpg",
      "adc1581a7c60d6dff564f845988d4b09.jpg","da313339ddcdd1f540e5d17061016fa3.webp",
      "00a19a542e733ccfa0ece62912dd4415.jpg","0021172ac691cf7285730804c095cd9e.webp",
      "14cefc3019af2903039209e13113581b.webp","3b4e433275e4e4b51415df4cd7f0df6a.webp",
      "a20d8b06612784cdf71e226274ca6ce8.jpg","6f3949cafac816bb809b41b4c33ff2c7.webp",
      // original event photos
      "boaz-45.jpg","boaz-46.jpg","boaz-301.jpg","boaz-328.jpg","boaz-331.jpg","boaz-332.jpg",
      "boaz-333.jpg","boaz-334.jpg","boaz-344.jpg","boaz-345.jpg","boaz-346.jpg","boaz-352.jpg",
      "boaz-353.jpg","boaz-354.jpg","boaz-377.jpg","boaz-378.jpg","boaz-383.jpg","boaz-394.jpg",
      "boaz-402.jpg","boaz-403.jpg","boaz-406.jpg","boaz-407.jpg","boaz-408.jpg","boaz-524.jpg","boaz-891.jpg"
    ];
    const grid = document.getElementById("grid");
    files.forEach((f) => {
      const fig = document.createElement("figure");
      fig.innerHTML = '<img src="assets/landing/' + f + '" alt="' + f + '" loading="lazy"><figcaption>' + f + '</figcaption>';
      grid.appendChild(fig);
    });
  </script>
  <script src="assets/js/script.js"></script>
</body>
</html>
